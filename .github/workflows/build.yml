name: Build TrayApp

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-11-arm
    
    steps:
    - uses: actions/checkout@v4
      
    - name: Configure CMake
      run: |
        cmake -S . -B build -G "Visual Studio 17 2022" -A ARM64
      shell: powershell
    
    - name: Build
      run: |
        cmake --build build --config Release
      shell: powershell
      
    - name: Verify generated files and binaries
      run: |
        echo 'Checking for generated MIDL files...'
        $requiredFiles = @(
          'build\rpc\TrayService.h',
          'build\rpc\TrayService_c.c',
          'build\rpc\TrayService_s.c',
          'build\TrayApp.exe',
          'build\TrayService.exe'
        )

        foreach ($file in $requiredFiles) {
          if (-not (Test-Path $file)) {
            Write-Error "$file not found!"
            exit 1
          }
          Write-Host "Found $file"
        }

        Get-Item build\TrayApp.exe, build\TrayService.exe | Select-Object FullName, Length
      shell: powershell

    - name: Create TrayApp package
      if: success()
      run: |
        New-Item -ItemType Directory -Force -Path TrayApp | Out-Null
        Copy-Item build\TrayApp.exe TrayApp\
        Copy-Item build\TrayService.exe TrayApp\
        Copy-Item install_service.bat TrayApp\
        Copy-Item uninstall_service.bat TrayApp\
      shell: powershell
      
    - name: Upload TrayApp package
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: TrayApp
        path: TrayApp/
        retention-days: 90
