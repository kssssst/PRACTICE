name: Build TrayApp

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    strategy:
      matrix:
        config: [Release]
        
    steps:
    - uses: actions/checkout@v3
    
    - name: Install CMake
      run: |
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
      shell: powershell
        
    - name: Create build directory
      run: |
        mkdir build
      shell: powershell
      
    - name: Configure CMake
      run: |
        cd build
        cmake .. -G "Visual Studio 17 2022" -A ARM64
      shell: powershell
    
    - name: Build Project
      run: |
        cd build
        cmake --build . --config Release --verbose
      shell: powershell
      
    - name: Verify Build Artifacts
      run: |
        echo "Checking for TrayApp.exe..."
        if (Test-Path "build\Release\TrayApp.exe") {
          Write-Host "✓ TrayApp.exe found"
          Get-Item build\Release\TrayApp.exe | Select-Object FullName, Length
        } else {
          Write-Error "TrayApp.exe not found!"
          exit 1
        }
        
        echo "Checking for TrayService.exe..."
        if (Test-Path "build\service\Release\TrayService.exe") {
          Write-Host "✓ TrayService.exe found"
          Get-Item build\service\Release\TrayService.exe | Select-Object FullName, Length
        } else {
          Write-Error "TrayService.exe not found!"
          exit 1
        }
      shell: powershell
      
    - name: Upload TrayApp Artifact
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: TrayApp
        path: build/Release/TrayApp.exe
        retention-days: 90
        
    - name: Upload TrayService Artifact
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: TrayService
        path: build/service/Release/TrayService.exe
        retention-days: 90
        
    - name: Create Release Package
      if: success()
      run: |
        mkdir -p release_package
        copy build\Release\TrayApp.exe release_package\
        copy build\service\Release\TrayService.exe release_package\
        copy install_service.bat release_package\
        copy uninstall_service.bat release_package\
        copy README.md release_package\
        copy BUILD.md release_package\
        copy IMPLEMENTATION_GUIDE.md release_package\
      shell: powershell
      
    - name: Upload Release Package
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: TrayApp-Complete-Package
        path: release_package/
        retention-days: 90
        
    - name: Upload Debug Artifacts
      if: matrix.config == 'Debug'
      uses: actions/upload-artifact@v3
      with:
        name: TrayApp-${{ matrix.config }}
        path: build/Debug/TrayApp.exe
        retention-days: 7
