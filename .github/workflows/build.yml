name: Build TrayApp

on:
  push:
  pull_request:
    branches: [ main ]

env:
  BUILD_CONFIGURATION: Release
  PRODUCT_VERSION: 1.0.${{ github.run_number }}

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    
    steps:
    - uses: actions/checkout@v4
      
    - name: Configure CMake
      run: |
        cmake -S . -B build -G "Visual Studio 17 2022" -A $env:BUILD_PLATFORM
      shell: powershell
      env:
        BUILD_PLATFORM: ${{ matrix.platform }}
    
    - name: Build
      run: |
        cmake --build build --config $env:BUILD_CONFIGURATION
      shell: powershell
      
    - name: Verify generated files and binaries
      run: |
        echo 'Checking for generated MIDL files...'
        $requiredFiles = @(
          'build\rpc\TrayService.h',
          'build\rpc\TrayService_c.c',
          'build\service\rpc\TrayService_s.c',
          'build\TrayApp.exe',
          'build\TrayService.exe'
        )

        foreach ($file in $requiredFiles) {
          if (-not (Test-Path $file)) {
            Write-Error "$file not found!"
            exit 1
          }
          Write-Host "Found $file"
        }

        Get-Item build\TrayApp.exe, build\TrayService.exe | Select-Object FullName, Length
      shell: powershell

    - name: Prepare installer payload
      if: success()
      run: |
        .\TrayAppInstaller\scripts\Prepare-Payload.ps1 `
          -AppBuildBin .\build `
          -PayloadDir .\TrayAppInstaller\src\payload

        .\TrayAppInstaller\scripts\Generate-WixPayload.ps1 `
          -PayloadDir .\TrayAppInstaller\src\payload `
          -OutputPath .\TrayAppInstaller\src\Payload.generated.wxs
      shell: powershell

    - name: Build TrayApp installer
      if: success()
      run: |
        dotnet build .\TrayAppInstaller\src\TrayAppInstaller.wixproj `
          -c $env:BUILD_CONFIGURATION `
          -p:InstallerPlatform=${{ matrix.platform == 'ARM64' && 'arm64' || 'x64' }} `
          -p:ProductVersion=$env:PRODUCT_VERSION `
          -p:PayloadDir="$PWD\TrayAppInstaller\src\payload"
      shell: powershell

    - name: Verify installer
      if: success()
      run: |
        $installer = Get-Item ".\TrayAppInstaller\src\bin\$env:BUILD_CONFIGURATION\TrayAppSetup.msi"
        if (-not $installer) {
          Write-Error "TrayAppSetup.msi was not produced."
          exit 1
        }

        $payloadFiles = Get-ChildItem .\TrayAppInstaller\src\payload -File -Recurse
        $requiredPayload = @('TrayApp.exe', 'TrayService.exe')
        foreach ($file in $requiredPayload) {
          if (-not ($payloadFiles | Where-Object { $_.Name -ieq $file })) {
            Write-Error "Installer payload is missing required file: $file"
            exit 1
          }
        }

        Write-Host "Built installer:"
        $installer | Select-Object FullName, Length
        Write-Host "Payload files included in installer:"
        $payloadFiles | Select-Object FullName, Length
      shell: powershell

    - name: Upload TrayApp installer
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: TrayAppInstaller-${{ matrix.platform }}
        path: TrayAppInstaller/src/bin/${{ env.BUILD_CONFIGURATION }}/TrayAppSetup.msi
        retention-days: 90
