name: Build TrayApp and TrayService

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        shell: powershell
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A ARM64

      - name: Build
        shell: powershell
        run: cmake --build build --config Release --verbose

      - name: Verify Artifacts
        shell: powershell
        run: |
          if (-not (Test-Path "build\TrayApp.exe")) {
            Write-Error "TrayApp.exe not found"
            exit 1
          }

          if (-not (Test-Path "build\TrayService.exe")) {
            Write-Error "TrayService.exe not found"
            exit 1
          }

          Get-Item "build\TrayApp.exe" | Select-Object FullName, Length
          Get-Item "build\TrayService.exe" | Select-Object FullName, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TrayApp-Release
          path: |
            build/TrayApp.exe
            build/TrayService.exe
